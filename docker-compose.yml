services:
  bitrix-passport-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitrix-passport-exporter
    env_file:
      - .env
    ports:
      - "25504:25504"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:25504/readyz | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
